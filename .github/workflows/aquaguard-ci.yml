name: aquaguard-ci

on:
  push:
    paths: ["projects/aquaguard-ai/**"]
  pull_request:
    paths: ["projects/aquaguard-ai/**"]

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: projects/aquaguard-ai
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -e '.[dev]'
      - run: ruff check .
      - run: pytest

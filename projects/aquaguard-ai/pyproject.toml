[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "aquaguard-ai"
version = "4.0.0a1"
description = "Pool safety monitoring engineering baseline"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115,<1", "pydantic-settings>=2.7,<3", "uvicorn[standard]>=0.34,<1"]

[project.scripts]
aquaguard-benchmark = "aquaguard.benchmark_cli:main"
aquaguard-import-evaluation = "aquaguard.evaluation_import_cli:main"
aquaguard-resolve-annotations = "aquaguard.annotation_cli:main"
aquaguard-qualify-reviewer = "aquaguard.annotation_quality_cli:qualify_main"
aquaguard-annotation-agreement = "aquaguard.annotation_quality_cli:agreement_main"

[project.optional-dependencies]
dev = ["httpx>=0.28,<1", "pytest>=8.3,<9", "ruff>=0.9,<1"]
vision = ["numpy>=2,<3", "opencv-python-headless>=4.10,<5", "ultralytics>=8.3,<9"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
